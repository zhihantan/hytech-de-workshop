# 参考答案管道：实验 03 的完整版本（bronze → silver → gold，无服务器），事件日志发布到同一 schema。
# Reference solution pipeline: the complete version of lab 03 (bronze → silver → gold, serverless),
# with its event log published to the same schema.
resources:
  pipelines:
    hytech_trade_lakehouse_solution:
      name: hytech_trade_lakehouse_solution
      catalog: ${var.catalog}
      schema: ${var.solutions_schema}
      serverless: true
      channel: CURRENT
      continuous: false
      root_path: ../solutions/pipeline
      libraries:
        - glob:
            include: ../solutions/pipeline/transformations/**
      configuration:
        landing_root: /Volumes/${var.catalog}/raw/landing
        ref_root: /Volumes/${var.catalog}/raw/ref
      event_log:
        catalog: ${var.catalog}
        schema: ${var.solutions_schema}
        name: pipeline_event_log
